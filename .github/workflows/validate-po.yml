name: Validate Portable Object

on:
  push:
    branches: [main]
    paths:
      - "locale/pl_PL.po"
      - "locale/undertale.pot"
      - "scripts/validate_po.py"
  pull_request:
    paths:
      - "locale/pl_PL.po"
      - "locale/undertale.pot"
      - "scripts/validate_po.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate locale/pl_PL.po against locale/undertale.pot
        run: python3 scripts/validate_po.py
