name: Build data.win

# Builds a data.win with every locale/<code>.po built in as a selectable
# in-game language (Settings > Language), and publishes it as a downloadable
# asset on the "translations" GitHub Release.

on:
  push:
    branches: [main]
    paths:
      - "locale/*.po"
      - "fonts/**"
      - "scripts/build_data.csx"
      - "scripts/lib/*.csx"
      - "build/pristine.win"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download UndertaleModCli (nightly, Linux)
        run: |
          curl -sL -o cli.zip \
            "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/nightly/CLI-ubuntu-latest-Debug-isBundled-true.zip"
          mkdir -p UndertaleModCli
          unzip -q cli.zip -d UndertaleModCli
          chmod +x UndertaleModCli/UndertaleModCli
          rm cli.zip

      - name: Build data.win with every registered locale
        run: |
          UndertaleModCli/UndertaleModCli load build/pristine.win \
            --scripts scripts/build_data.csx \
            -o data.win -f

      - name: Publish/update the translations GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GAME_VERSION=$(grep -oP '(?<=X-Game-Data-Version: )[^\\]+' locale/undertale.pot)
          GAME_SHA=$(grep -oP '(?<=X-Game-Data-SHA256: )[^\\]+' locale/undertale.pot)
          LANGUAGES=$(python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from validate_po import get_header, LOCALE_DIR
          print(', '.join(get_header(p)['X-Display-Name'] for p in sorted(LOCALE_DIR.glob('*.po'))))
          ")

          cat > release_notes.md <<EOF
          Automatycznie zbudowany plik \`data.win\` z tłumaczeniami: **${LANGUAGES}**.

          Języki są wbudowane w plik i przełączane w grze: Settings → Language
          (strzałki lewo/prawo).

          **Zgodne z wersją gry:** \`${GAME_VERSION}\`
          (SHA-256 oryginalnego data.win: \`${GAME_SHA}\`)

          **Instalacja:**
          1. Pobierz \`data.win\` poniżej.
          2. Zrób kopię zapasową oryginalnego \`data.win\` z folderu gry (Undertale/data.win).
          3. Podmień plik w folderze gry na pobrany.
          EOF

          gh release view translations >/dev/null 2>&1 || gh release create translations \
            --title "Tłumaczenia" \
            --prerelease \
            --notes-file release_notes.md

          gh release upload translations data.win --clobber
          gh release edit translations --notes-file release_notes.md
