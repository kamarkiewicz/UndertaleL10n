name: Build data.win

# Builds a data.win with every locale/<code>.po built in as a selectable
# in-game language (Settings > Language), and publishes it as a downloadable
# asset on the "multilingual" GitHub Release.

on:
  push:
    branches: [main]
    paths:
      - "locale/*.po"
      - "fonts/**"
      - "sprites/**"
      - "patches/*.patch"
      - "scripts/build_data.csx"
      - "scripts/lib/*.csx"
      - "build/pristine.win"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download UndertaleModCli (nightly, Linux)
        run: |
          curl -sL -o cli.zip \
            "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/nightly/CLI-ubuntu-latest-Debug-isBundled-true.zip"
          mkdir -p UndertaleModCli
          unzip -q cli.zip -d UndertaleModCli
          chmod +x UndertaleModCli/UndertaleModCli
          rm cli.zip

      - name: Build data.win with every registered locale
        run: |
          UndertaleModCli/UndertaleModCli load build/pristine.win \
            --scripts scripts/build_data.csx \
            -o data.win -f

      - name: Publish/update the multilingual GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GAME_VERSION=$(grep -oP '(?<=X-Game-Data-Version: )[^\\]+' locale/undertale.pot)
          GAME_SHA=$(grep -oP '(?<=X-Game-Data-SHA256: )[^\\]+' locale/undertale.pot)

          python3 - "$GAME_VERSION" "$GAME_SHA" > release_notes.md <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from validate_po import get_header, LOCALE_DIR

          game_version, game_sha = sys.argv[1], sys.argv[2]

          # Per-language install instructions. Add an entry here whenever a
          # new locale/<code>.po is added; unknown codes get a generic
          # English fallback so the release still builds without one.
          INSTRUCTIONS = {
              "pl": ("🇵🇱", "Polski",
                     "pobierz `data.win` i podmień nim `Undertale/data.win` w "
                     "folderze gry. Język wybierz w grze: Settings → Language "
                     "(strzałki lewo/prawo)."),
              "es": ("🇪🇸", "Español",
                     "descarga `data.win` y reemplaza `Undertale/data.win` en la "
                     "carpeta del juego. Elige idioma en el juego: Settings → "
                     "Language (flechas izquierda/derecha)."),
          }

          lines = [
              f"Compatible with game version `{game_version}` "
              f"(SHA-256: `{game_sha}`)",
              "",
              "🇬🇧 **English:** download `data.win` and replace "
              "`Undertale/data.win` in your game folder. Switch language "
              "in-game: Settings → Language (left/right arrows).",
          ]
          for po_path in sorted(LOCALE_DIR.glob("*.po")):
              code = po_path.stem
              display_name = get_header(po_path)["X-Display-Name"]
              flag, label, text = INSTRUCTIONS.get(
                  code,
                  ("🌐", display_name,
                   "download `data.win` and replace `Undertale/data.win` in "
                   "your game folder. Switch language in-game: Settings → "
                   "Language."),
              )
              lines.append("")
              lines.append(f"{flag} **{label}:** {text}")

          print("\n".join(lines))
          PY

          gh release view multilingual >/dev/null 2>&1 || gh release create multilingual \
            --title "Multilingual" \
            --prerelease \
            --notes-file release_notes.md

          gh release upload multilingual data.win --clobber
          gh release edit multilingual --notes-file release_notes.md
