name: Build release

# Builds a data file with every locale/<code>.po built in as a selectable
# in-game language (Settings > Language), for every platform/storefront
# combination we have a pristine source for (build/<storefront>_<filename>),
# and publishes each as a downloadable asset on the "multilingual" GitHub
# Release.

on:
  push:
    branches: [main]
    paths:
      - "locale/*.po"
      - "fonts/**"
      - "sprites/**"
      - "sounds/**"
      - "patches/*.patch"
      - "scripts/build_data.csx"
      - "scripts/lib/*.csx"
      - "build/*_data.win"
      - "build/*_game.ios"
      - "build/*_game.unx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Release assets are named exactly like their build/ source
          # (<storefront>_<real filename> - see README's "Platforms"
          # section) - players rename to the real filename on install,
          # e.g. steam_data.win -> data.win.
          - pristine: build/steam_data.win
            asset: steam_data.win
            label: Windows (Steam)
          - pristine: build/steam_game.ios
            asset: steam_game.ios
            label: macOS (Steam)
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download UndertaleModCli (nightly, Linux)
        run: |
          curl -sL -o cli.zip \
            "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/nightly/CLI-ubuntu-latest-Debug-isBundled-true.zip"
          mkdir -p UndertaleModCli
          unzip -q cli.zip -d UndertaleModCli
          chmod +x UndertaleModCli/UndertaleModCli
          rm cli.zip

      - name: Build ${{ matrix.asset }} (${{ matrix.label }}) with every registered locale
        run: |
          UndertaleModCli/UndertaleModCli load "${{ matrix.pristine }}" \
            --scripts scripts/build_data.csx \
            -o "${{ matrix.asset }}" -f

      - name: Record this platform's own pristine source version
        run: |
          SOURCE_INFO_OUT="${{ matrix.asset }}.info" \
            UndertaleModCli/UndertaleModCli load "${{ matrix.pristine }}" \
            --scripts scripts/source_info.csx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.info
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish/update the multilingual GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 > release_notes.md <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from validate_po import get_header, parse_po, LOCALE_DIR

          BANNER = "https://upload.wikimedia.org/wikipedia/commons/2/26/Undertale-logo.jpg"

          # Each platform build's own pristine source version - see
          # scripts/source_info.csx. Different platforms/storefronts can
          # report different version numbers for what's otherwise the same
          # translatable text (confirmed: Windows Steam vs macOS Steam), so
          # there's no single "the game version" - each asset gets its own.
          def read_info(asset):
              info = {}
              path = Path("dist") / f"{asset}.info"
              for line in path.read_text().splitlines():
                  key, _, value = line.partition("=")
                  info[key] = value
              return info

          platforms = [
              ("steam_data.win", "data.win", "🪟 Windows (Steam)", ""),
              ("steam_game.ios", "game.ios", "🍎 macOS (Steam)",
               " (inside `UNDERTALE.app/Contents/Resources/`)"),
          ]

          # Per-language flag. Add an entry here whenever a new locale/<code>.po
          # is added; unknown codes fall back to a generic globe.
          FLAGS = {"de": "🇩🇪", "fr": "🇫🇷", "it": "🇮🇹", "pl": "🇵🇱", "es": "🇪🇸"}

          # Credits not derivable from the .po's own X-Source header (kept in
          # sync with the README's "I want to play" table).
          CREDIT_OVERRIDE = {"pl": "Krzyhau"}

          def credit_for(code, header):
              if code in CREDIT_OVERRIDE:
                  return CREDIT_OVERRIDE[code]
              source = header.get("X-Source", "")
              name, _, url = source.partition(", ")
              return f"[{name}]({url})" if url else (name or "—")

          pot_ids = {mid for mid, _, _, _ in parse_po(LOCALE_DIR / "undertale.pot") if mid}

          def coverage_for(po_path):
              entries = parse_po(po_path)
              translated = sum(
                  1 for mid, mstr, fuzzy, _ in entries
                  if mid in pot_ids and mstr and not fuzzy
              )
              return translated / len(pot_ids) if pot_ids else 0

          lines = [
              f'<p align="center"><img src="{BANNER}" width="360" alt="Undertale logo"></p>',
              '<p align="center"><sub><strong>Localization Project</strong></sub></p>',
              "",
              "Download the file for your platform, rename it, and drop it into your "
              "game folder — then switch language in-game via **Settings → Language** "
              "(left/right arrows).",
              "",
              "### Download",
              "",
              "| Platform | File → rename to | Game version |",
              "|---|---|---|",
          ]
          info_by_asset = {}
          for asset, real_name, label, location in platforms:
              info = read_info(asset)
              info_by_asset[asset] = info
              lines.append(
                  f"| {label} | `{asset}` → `{real_name}`{location} | `{info['version']}` |"
              )
          lines += [
              "",
              "<details>",
              "<summary>Verify your download (SHA-256 of the pristine source each "
              "build started from)</summary>",
              "",
          ]
          for asset, real_name, label, location in platforms:
              lines.append(f"- {label}: `{info_by_asset[asset]['sha256']}`")
          lines += [
              "",
              "</details>",
              "",
              "### Languages",
              "",
              "| | Language | Coverage | Credit |",
              "|---|---|---|---|",
              "| 🇬🇧 | English | built-in | — |",
          ]
          po_paths = sorted(LOCALE_DIR.glob("*.po"))
          for po_path in po_paths:
              code = po_path.stem
              header = get_header(po_path)
              display_name = header["X-Display-Name"].title()
              flag = FLAGS.get(code, "🌐")
              lines.append(
                  f"| {flag} | {display_name} | {coverage_for(po_path):.0%} | "
                  f"{credit_for(code, header)} |"
              )
          lines += [
              "",
              "This project stands on the shoulders of giants: the community "
              "translation teams credited above, and "
              "[UndertaleModTool](https://github.com/UnderminersTeam/UndertaleModTool) "
              "(UnderminersTeam), whose UndertaleModCli/UndertaleModLib make it "
              "possible to rebuild `data.win` with every language baked in.",
          ]

          print("\n".join(lines))
          PY

          gh release view multilingual >/dev/null 2>&1 || gh release create multilingual \
            --title "Multilingual" \
            --prerelease \
            --notes-file release_notes.md

          gh release upload multilingual dist/steam_data.win dist/steam_game.ios --clobber
          gh release edit multilingual --notes-file release_notes.md
